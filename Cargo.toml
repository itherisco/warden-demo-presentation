[workspace]

[package]
name = "demo-server"
version = "1.0.0"
edition = "2021"
authors = ["ITHERIS Team"]
description = "Warden Security Demo Server - Public demo for Render deployment"
license = "Apache-2.0"
repository = "https://github.com/projectx/itheris"

[[bin]]
name = "warden-demo-server"
path = "src/main.rs"

[dependencies]
warden-sdk = { path = "../warden-sdk" }
warden-sdk-types = { path = "../warden-sdk-types" }
axum = { version = "0.7", features = ["json", "tokio", "query", "macros"] }
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tower = { version = "0.4", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.5", features = ["cors"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

[features]
default = ["core-security"]
core-security = []