services:
  - type: web
    name: warden-demo
    runtime: rust
    plan: free
    region: oregon
    buildCommand: cargo build --release -p demo-server
    startCommand: ./target/release/warden-demo-server
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: CORS_ORIGINS
        value: "https://your-frontend.vercel.app,http://localhost:3000,http://localhost:5173"
    autoDeploy: true
    timeout: 300